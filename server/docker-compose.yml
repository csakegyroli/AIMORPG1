services:
  postgres:
    image: postgres:17-alpine
    container_name: aimorpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aimorpg
      POSTGRES_USER: aimorpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - aimorpg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimorpg -d aimorpg"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  aimorpg-postgres-data:
